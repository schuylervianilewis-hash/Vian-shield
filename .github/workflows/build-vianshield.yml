name: Build Vianshield Standalone APK

on:
  push:
    branches: [ "main", "master", "refactor/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vianshield:
    name: Test and Build Standalone APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vianshield repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Gradle unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble dual-ARM debug APK
        run: |
          mkdir -p dist
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk dist/vianshield-dual-arm-debug.apk

      - name: Verify APK artifact
        run: |
          if [ ! -s dist/vianshield-dual-arm-debug.apk ]; then
            echo "::error::APK was not generated or is empty."
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi
          echo "APK generated successfully:"
          ls -lh dist/vianshield-dual-arm-debug.apk
          echo "Packaged native libraries (if any):"
          unzip -l dist/vianshield-dual-arm-debug.apk "lib/*" || true

      - name: Diagnostic listing on failure
        if: failure()
        run: |
          echo "=== Build outputs ==="
          ls -laR app/build/outputs/ || true

      - name: Upload standalone debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vianshield-dual-arm-debug-apk
          path: dist/vianshield-dual-arm-debug.apk
          retention-days: 14
