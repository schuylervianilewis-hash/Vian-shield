name: Build Vianshield (Engine-Neutral)

on:
  push:
    branches: [ "main", "cleanup/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Test and Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Vianshield
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vianshield-engine-neutral-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
