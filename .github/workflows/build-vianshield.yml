name: Build Vianshield Standalone APK

on:
  push:
    branches: [ "main", "master", "refactor/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vianshield:
    name: Test and Build Standalone APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vianshield repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK and native build tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK and CMake
        run: sdkmanager --install "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Install pinned Rust toolchain and cargo-ndk
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo +1.95.0 install cargo-ndk --version 4.1.2 --locked
          cargo +1.95.0 fetch --manifest-path third_party/tracker-control/wgbridge-rs/Cargo.toml --locked

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Gradle unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble dual-ARM debug APK
        run: |
          mkdir -p dist
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk dist/vianshield-dual-arm-debug.apk

      - name: Verify APK artifact
        run: |
          if [ ! -s dist/vianshield-dual-arm-debug.apk ]; then
            echo "::error::APK was not generated or is empty."
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi
          echo "APK generated successfully:"
          ls -lh dist/vianshield-dual-arm-debug.apk
          echo "Packaged native libraries (if any):"
          unzip -l dist/vianshield-dual-arm-debug.apk "lib/*"
          for abi in armeabi-v7a arm64-v8a; do
            unzip -l dist/vianshield-dual-arm-debug.apk "lib/$abi/libnetguard.so" | grep -q "libnetguard.so"
            unzip -l dist/vianshield-dual-arm-debug.apk "lib/$abi/libwgbridge.so" | grep -q "libwgbridge.so"
          done

      - name: Diagnostic listing on failure
        if: failure()
        run: |
          echo "=== Build outputs ==="
          ls -laR app/build/outputs/ || true

      - name: Upload standalone debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vianshield-dual-arm-debug-apk
          path: dist/vianshield-dual-arm-debug.apk
          retention-days: 14
